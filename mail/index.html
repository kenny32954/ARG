<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1711">
<title>RWD // RECOVERED MAIL</title>
<style>
:root{--bg:#18150f;--paper:#d5c9a8;--ink:#2a261d;--red:#7c332e;--line:#5b523d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#332c1e,#17140e 55%);font-family:"Courier New",monospace;color:#ddd0ac}.shell{width:min(1200px,calc(100% - 20px));margin:auto;padding:18px 0 32px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding:5px 2px 12px;margin-bottom:12px}header p{margin:0 0 4px;color:#8d8061;font-size:.62rem}h1{margin:0;font-size:clamp(1.3rem,4vw,2.1rem);color:#f0e2bd}.tag{border:1px solid var(--line);padding:7px 10px;font-size:.61rem;color:#9b8d6b}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px}.panel{border:1px solid var(--line);background:#211c13;border-radius:4px;overflow:hidden}.bar{display:flex;justify-content:space-between;gap:9px;align-items:center;min-height:34px;padding:8px 10px;border-bottom:1px solid var(--line);background:#1b170f;color:#8f8263;font-size:.61rem}.list{padding:8px}.item{width:100%;border:1px solid #514936;background:#211d14;color:#c9bb96;text-align:left;padding:9px;margin-bottom:6px;font:inherit;font-size:.63rem}.item small{display:block;color:#766b50;margin-top:4px}.item.active{border-color:#9d8c65;background:#2d271a}.item.locked{opacity:.35}.viewer{padding:16px;min-height:640px;background:#0d0b08}.desk{background:#3b3122;padding:clamp(12px,3vw,30px);min-height:600px;display:grid;place-items:center;position:relative;overflow:hidden}.envelope{width:min(720px,92%);aspect-ratio:1.55/1;background:linear-gradient(135deg,#d4c7a2,#bcae86);color:var(--ink);box-shadow:0 15px 35px #000;position:relative;padding:35px;transform:rotate(-1deg);border:1px solid #8e8266}.envelope:before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,50% 55%,100% 0);background:rgba(255,255,240,.1);border-bottom:1px solid rgba(70,60,40,.25)}.stamp{position:absolute;right:34px;top:30px;border:3px double #72584c;color:#72584c;padding:9px 12px;font-size:.64rem;transform:rotate(5deg)}.addr{position:absolute;left:14%;top:47%;font-family:Georgia,serif;font-size:clamp(.9rem,2.2vw,1.25rem);line-height:1.6}.postmark{position:absolute;right:12%;top:24%;font-size:.56rem;color:#675c49;transform:rotate(-8deg)}.pressure{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;font-family:"Comic Sans MS",cursive;font-size:clamp(1rem,3vw,2rem);color:rgba(85,66,45,0);text-shadow:1px 1px rgba(255,255,230,0);transform:rotate(-3deg);transition:.1s}.insert{margin-top:16px;background:var(--paper);color:var(--ink);padding:18px;width:min(720px,92%);box-shadow:0 8px 20px #000;font-family:Georgia,serif;line-height:1.55;display:none}.insert.show{display:block}.controls{padding:12px}.controls div{display:flex;justify-content:space-between;font-size:.61rem;color:#897c5e;margin-bottom:5px}.controls input{width:100%;accent-color:#aa9568}.status{padding:0 12px 12px;font-size:.6rem;color:#807356;line-height:1.45}footer{display:flex;justify-content:space-between;gap:12px;padding:12px 2px 0;color:#665b43;font-size:.54rem}@media(max-width:760px){.layout{grid-template-columns:1fr}.viewer{min-height:500px}.desk{min-height:470px}}@media(max-width:500px){header{flex-direction:column;align-items:flex-start}.tag{align-self:flex-end}.envelope{padding:20px}.stamp{right:18px;top:18px}.addr{left:10%}}
</style>
</head>
<body>
<main class="shell">
<header><div><p>HERMAN VALE / RECOVERED PERSONAL EFFECTS</p><h1>MAIL EVIDENCE ARCHIVE</h1></div><div class="tag">SIMULATED PHYSICAL MEDIA</div></header>
<section class="layout">
  <aside class="panel"><div class="bar"><span>ITEMS</span><span id="count">0</span></div><div class="list" id="list"></div></aside>
  <article class="panel">
    <div class="bar"><span>DOCUMENT TABLE</span><span id="itemId">—</span></div>
    <div class="viewer">
      <div class="desk">
        <div class="envelope" id="envelope"><div class="stamp" id="stamp"></div><div class="postmark" id="postmark"></div><div class="addr" id="addr"></div><div class="pressure" id="pressure"></div></div>
        <div class="insert" id="insert"></div>
      </div>
      <div class="controls"><div><span>RAKING LIGHT</span><strong id="lightOut">0%</strong></div><input id="light" type="range" min="0" max="100" value="0"></div>
      <div class="status" id="status">Oblique light can expose indentations that ordinary scanning misses.</div>
    </div>
  </article>
</section>
<footer><span>MAIL ARCHIVE // DIGITAL RECONSTRUCTION</span><span>NO REAL MAILING ADDRESS USED</span></footer>
</main>
<script>
(() => {
"use strict";
const $=q=>document.querySelector(q),P1="echo1.phase1.state.v1",KEY="echo1.mail.v1";
const els={list:$("#list"),count:$("#count"),id:$("#itemId"),stamp:$("#stamp"),post:$("#postmark"),addr:$("#addr"),pressure:$("#pressure"),insert:$("#insert"),light:$("#light"),out:$("#lightOut"),status:$("#status")};
const items=[
 {id:"M-01",unlock:()=>true,stamp:"LOCAL / SEP 18",post:"RAVENSWOOD 00:12",addr:"HERMAN VALE\nPERSONAL",pressure:"STOP LISTENING",insert:"No return address. The envelope arrived unsealed. The paper inside was blank."},
 {id:"M-02",unlock:p=>p.g7Fix,stamp:"NO POSTAGE",post:"NO ROUTING MARK",addr:"HERMAN\nYOU FOUND IT",pressure:"ROOM 3 IS BELOW YOU",insert:"A photocopied utility parcel map. G-7 has been blacked out by hand, but the reverse carries the impression of a circular loop."},
 {id:"M-03",unlock:p=>p.valeLetters,stamp:"ARCHIVE COPY",post:"DATE UNKNOWN",addr:"H. VALE\nFROM M.",pressure:"IF IT SOUNDS LIKE ME, HANG UP",insert:"The paper stock matches Mara Vale's archived correspondence. No original envelope is present in the municipal evidence box."}
];
let available=[],selected=0;
function progress(){try{return JSON.parse(localStorage.getItem(P1)||"{}").discovered||{}}catch{return{}}}
function load(){const p=progress();available=items.filter(i=>i.unlock(p));els.count.textContent=available.length+" ITEMS";renderList();show(0)}
function renderList(){els.list.replaceChildren();available.forEach((it,i)=>{const b=document.createElement("button");b.type="button";b.className="item"+(i===selected?" active":"");b.innerHTML=`${it.id}<small>${it.stamp}</small>`;b.onclick=()=>show(i);els.list.appendChild(b)})}
function show(i){selected=i;renderList();const it=available[i];if(!it)return;els.id.textContent=it.id;els.stamp.textContent=it.stamp;els.post.textContent=it.post;els.addr.textContent=it.addr;els.pressure.textContent=it.pressure;els.insert.textContent=it.insert;els.insert.classList.add("show");els.light.value=0;light()}
function light(){const v=+els.light.value;els.out.textContent=v+"%";const a=Math.max(0,(v-35)/65);els.pressure.style.color=`rgba(85,66,45,${a*.5})`;els.pressure.style.textShadow=`1px 1px rgba(255,255,230,${a*.6})`;if(v>82){els.status.textContent="INDENTATION LAYER RECOVERED.";try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");s[available[selected].id]=true;localStorage.setItem(KEY,JSON.stringify(s))}catch{}}else els.status.textContent="Oblique light can expose indentations that ordinary scanning misses."}
els.light.addEventListener("input",light);load();
})();
</script>
</body>
</html>
